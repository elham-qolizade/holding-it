<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نگه داشتم — زنده</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#fff8ec">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="نگه داشتم">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Courier+Prime:wght@400;700&family=Fredoka:wght@700&family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Handjet:wght@400..800&amp;text=%DB%B0%DB%B1%DB%B2%DB%B3%DB%B4%DB%B5%DB%B6%DB%B7%DB%B8%DB%B9&amp;display=swap" rel="stylesheet">
<style>
  /* Retro desktop look: a dithered pastel "desktop", a menu bar, cream windows with striped
     title bars, pixel type and pixel icons. The page title alone is big, bold and cartoonish. */
  :root {
    color-scheme: light;
    --desk: #ffc2d1;
    --panel: #fff8ec;
    --ink: #2a1a4a;
    --muted: #6a5a80;
    --pink: #ff9ebb;
    --yellow: #ffd23f;
    --teal: #3fd0bd;
    --coral: #ff7a6b;
    --lilac: #c3adff;
    --mint: #c9f7e6;
    --butter: #fff0b0;
    --blush: #ffe0e8;
    --green: #1f9d55;
    --amber: #e08a00;
    /* The Latin fonts have no Persian glyphs. Persian digits come from a digits-only Handjet (pixel)
       subset and Persian words from Vazirmatn. Handjet's Persian letters came out with gaps between
       them on iPhone Safari, so it is not used for words. */
    --pixel: 'Pixelify Sans', 'Handjet', 'Vazirmatn', monospace;
    --type: 'Courier Prime', 'Vazirmatn', monospace;
    --title: 'Fredoka', 'Vazirmatn', system-ui, sans-serif;
  }
  /* Persian: Courier's wide monospace space breaks up Persian words */
  :root:lang(fa) { --type: 'Vazirmatn', sans-serif; }
  :lang(fa) :is(.win h2, .menubar) { font-size: 1.05rem; }
  :lang(fa) :is(.win h2, .menubar, #title, #nudge .body, #toast, .breaking b, .namerow, .btn) { font-weight: 700; }
  :lang(fa) .btn { font-size: 1.3rem; } :lang(fa) .btn.small { font-size: 1rem; }
  :lang(fa) :is(.menubar, .tag, .total, .tile small, footer, .win h2) { letter-spacing: 0; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0 0 56px; min-height: 100vh;
    color: var(--ink); font: 1rem/1.55 var(--type);
    background:   /* 2px checkerboard dither over a sunset gradient */
      linear-gradient(45deg, #fff6 25%, transparent 25%, transparent 75%, #fff6 75%) 0 0 / 4px 4px,
      linear-gradient(45deg, #fff6 25%, transparent 25%, transparent 75%, #fff6 75%) 2px 2px / 4px 4px,
      linear-gradient(165deg, #ffb3c8 0%, #ffd3a8 55%, #a9ecdf 100%) fixed var(--desk);
  }
  .px svg { display: block; width: 1em; height: 1em; fill: currentColor; }

  .menubar {
    display: flex; align-items: stretch; gap: 4px; min-height: 34px; padding: 0 8px;
    background: var(--panel); border-bottom: 2px solid var(--ink);
    font: 600 0.94rem/1 var(--pixel); letter-spacing: .03em;
  }
  .menubar > * { display: flex; align-items: center; padding: 0 10px; }
  .menubar .logo { background: var(--lilac); color: var(--ink); border-inline-end: 2px solid var(--ink); font-size: 18px; padding: 0 8px; }
  .menubar .spacer { flex: 1; padding: 0; }
  .menubar [hidden] { display: none; }
  .menubar button { border: 0; background: none; min-height: 34px; }
  .menubar button:hover, .menubar button:active { background: var(--ink); color: var(--panel); }

  main { max-width: 500px; margin: 0 auto; padding: 28px 12px 0; display: grid; gap: 18px; }
  header { text-align: center; }
  h1 { font: 700 clamp(40px, 11vw, 56px)/1.2 var(--title); margin: 0; -webkit-font-smoothing: auto;
       text-shadow: 3px 3px 0 var(--panel); }
  h1 .hl { display: inline-block; padding: 0 .2em; background: var(--yellow); border: 3px solid var(--ink);
           border-radius: 12px; box-shadow: 4px 4px 0 var(--ink); transform: rotate(-3deg); text-shadow: none; }
  .how { margin: 10px auto 0; max-width: 36ch; }
  .tag { margin: 14px 0 0; letter-spacing: .04em; text-transform: uppercase; font-size: 0.82rem; }

  .win { background: var(--panel); border: 1px solid var(--ink); border-radius: 3px; box-shadow: 2px 2px 0 var(--ink); overflow: hidden; }
  .win h2 {
    margin: 0; padding: 4px 6px; display: flex; align-items: center; gap: 8px;
    border-bottom: 1px solid var(--ink);
    font: 600 0.94rem/1.2 var(--pixel); text-transform: uppercase; letter-spacing: .04em;
  }
  .win h2::before, .win h2::after {   /* pinstripes either side of the window title */
    content: ''; flex: 1; height: 11px;
    background: repeating-linear-gradient(to bottom, var(--ink) 0 1px, transparent 1px 2px);
  }
  .win h2 { background: var(--bar, var(--panel)); }   /* each window gets its own title-bar colour */
  .win[aria-live] { --bar: var(--teal); } #timerBox { --bar: var(--coral); }
  .win.newswin { --bar: var(--pink); }
  .breaking { padding: 14px 16px; background: var(--ink); color: var(--panel); }
  .breaking b { display: inline-block; padding: 1px 8px; margin-bottom: 8px; background: var(--yellow); color: var(--ink);
                font: 700 0.9rem/1.5 var(--pixel); text-transform: uppercase; letter-spacing: .04em; }
  :lang(fa) .breaking b { font-size: 0.95rem; letter-spacing: 0; }
  .breaking p { margin: 0; font-size: 1.05rem; font-weight: 700; line-height: 1.6; }
  .news { list-style: none; margin: 0; padding: 6px 16px 10px; font-size: 0.95rem; }
  .news li { padding: 9px 0; border-bottom: 1px dotted var(--ink); }
  .news li:last-child { border-bottom: 0; }
  .win.soswin { --bar: var(--coral); }
  #sosBtn { width: 100%; background: var(--coral); }
  #sosStatus { margin: 12px 0 0; padding: 8px 12px; border: 2px dashed var(--ink); border-radius: 8px; font-weight: 700; }
  #sosStatus.warn { background: var(--yellow); border-style: solid; box-shadow: 2px 2px 0 var(--ink); }
  #sosStatus.warn::before { content: '⚠️ '; }
  #sosStatus:empty { display: none; }
  #sosList { list-style: none; margin: 10px 0 0; padding: 0; padding-inline-end: 6px; max-height: 55vh; overflow-y: auto;
             overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--ink) transparent; }
  #sosList li { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 10px 0; border-top: 1px dotted var(--ink); }
  #sosAdd { margin-top: 16px; padding-top: 8px; border-top: 1px dotted var(--ink); }
  #sosAdd summary { cursor: pointer; font-weight: 700; min-height: 44px; display: flex; align-items: center; }
  #sosAdd .fee { display: flex; gap: 16px; flex-wrap: wrap; margin: 10px 0; }
  #sosAdd .fee label { display: flex; align-items: center; gap: 6px; min-height: 36px; cursor: pointer; }
  #sosNoteIn { width: 100%; min-height: 44px; padding: 6px 12px; background: var(--panel); color: var(--ink);
               border: 2px solid var(--ink); border-radius: 8px; font: 1rem/1.3 var(--type); }
  #sosNoteIn:focus-visible { outline: 2px dashed var(--ink); outline-offset: 3px; }
  #sosAddStatus { margin: 8px 0 0; font-weight: 700; }
  #sosAddStatus:empty { display: none; }
  #sosList .report { grid-column: 1; justify-self: start; min-height: 32px; padding: 0 2px; border: 0; background: none;
                     font: inherit; font-size: 0.82rem; color: var(--muted); text-decoration: underline; }
  #sosList li.group { display: block; border-top: 0; padding: 14px 0 2px; font-weight: 700; }
  #sosList b { font-size: 1.02rem; }
  #sosList .muted { grid-column: 1; }
  #sosList a { grid-column: 2; grid-row: 1 / span 2; width: auto; margin: 0; padding: 8px 14px; text-decoration: none; color: var(--ink); background: var(--teal); }
  .win.day { --bar: var(--yellow); } .win.feedwin { --bar: var(--lilac); }
  .win h2 .box { order: -1; width: 11px; height: 11px; flex: none; padding: 0; position: relative; border: 1px solid var(--ink); background: var(--panel); }
  .win h2 .box::after { content: ''; position: absolute; inset: -16px; }   /* bigger tap target */
  .win.shut .box { background: var(--ink); }
  .win.shut h2 { border-bottom: 0; }
  .win.shut > :not(h2) { display: none; }
  .body { padding: 16px; }

  .live { display: grid; grid-template-columns: 1fr 1fr; }
  .tile { padding: 14px 16px; }
  .tile + .tile { border-inline-start: 1px solid var(--ink); }
  .tile b { display: block; font: 700 56px/1 var(--pixel); font-variant-numeric: tabular-nums; }
  .tile small { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 0.85rem; text-transform: uppercase; letter-spacing: .03em; }
  .dot { width: 9px; height: 9px; flex: none; background: var(--c); border: 1px solid var(--ink); animation: blink 1.2s steps(2) infinite; }
  .tile.g { --c: var(--green); background: var(--mint); } .tile.y { --c: var(--amber); background: var(--butter); }
  @keyframes blink { 50% { background: transparent; } }
  .total { margin: 0; padding: 8px 16px; border-top: 1px solid var(--ink); text-align: center; font-size: 0.82rem; text-transform: uppercase; letter-spacing: .03em; }

  .namerow { display: flex; align-items: center; gap: 10px; font: 600 1.05rem/1 var(--pixel); }
  :lang(fa) .namerow { font-size: 1.05rem; }
  .namerow input {
    flex: 1; min-width: 0; min-height: 44px; padding: 6px 12px;
    background: var(--panel); color: var(--ink); border: 2px solid var(--ink); border-radius: 8px;
    box-shadow: inset 2px 2px 0 #2a1a4a22; font: 1rem/1.3 var(--type);
  }
  .namerow input:focus-visible { outline: 2px dashed var(--ink); outline-offset: 3px; }
  .buttons { display: grid; gap: 14px; }
  button { font: inherit; color: var(--ink); cursor: pointer; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    min-height: 64px; padding: 12px 16px;
    background: var(--panel); border: 2px solid var(--ink); border-radius: 10px;
    box-shadow: 3px 3px 0 var(--ink);
    font: 600 1.45rem/1.2 var(--pixel);
  }
  #holdBtn { background: var(--yellow); } #shareBtn { background: var(--lilac); }
  .btn.primary { background: var(--teal); box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--ink); margin: 4px; }
  .btn:hover:not(:disabled) { filter: brightness(1.07) saturate(1.1); }
  .btn:active:not(:disabled) { background: var(--ink); color: var(--panel); box-shadow: none; transform: translate(3px, 3px); }
  .btn.primary:active:not(:disabled) { color: var(--teal); transform: none; }
  .btn:disabled { opacity: .45; cursor: default; }
  #holdBtn:disabled { opacity: 1; background: var(--pink); box-shadow: none; transform: translate(3px, 3px); }
  .btn.small { width: 100%; min-height: 46px; margin-top: 10px; font-size: 1.05rem; border-width: 1px; border-radius: 8px; box-shadow: 2px 2px 0 var(--ink); }
  button:focus-visible { outline: 2px dashed var(--ink); outline-offset: 3px; }

  #timerBox .body { text-align: center; background: var(--blush); }
  #timer { font: 700 68px/1 var(--pixel); font-variant-numeric: tabular-nums; }
  #title { display: inline-block; margin: 10px 0 6px; padding: 2px 10px; background: var(--ink); color: var(--yellow); font: 600 1.05rem/1.4 var(--pixel); }
  .muted { color: var(--muted); font-size: 0.88rem; }
  #nudge .body { text-align: center; font: 600 1.1rem/1.4 var(--pixel); background: var(--yellow); }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; border: 1px solid var(--ink); }
  .stats > div { padding: 10px 4px; }
  .stats > div:nth-child(1) { background: var(--mint); } .stats > div:nth-child(2) { background: var(--butter); } .stats > div:nth-child(3) { background: var(--blush); }
  .stats > div + div { border-inline-start: 1px solid var(--ink); }
  .stats b { display: block; font: 700 28px/1.2 var(--pixel); font-variant-numeric: tabular-nums; }
  .stats .muted { font-size: 0.8rem; text-transform: uppercase; }
  .remind { display: flex; align-items: center; gap: 10px; min-height: 44px; margin-top: 10px; cursor: pointer; }
  .remind input { appearance: none; width: 18px; height: 18px; margin: 0; flex: none; border: 1px solid var(--ink); background-color: var(--panel); cursor: pointer; }
  .remind input:checked {   /* classic X-in-a-box checkbox */
    background-color: var(--teal);
    background-image: linear-gradient(45deg, transparent 44%, var(--ink) 44% 56%, transparent 56%),
                linear-gradient(-45deg, transparent 44%, var(--ink) 44% 56%, transparent 56%);
  }

  .feed { list-style: none; margin: 0; padding: 8px 12px; min-height: 290px; font-size: 0.95rem; }
  .feed li { padding: 7px 6px; border-bottom: 1px dotted var(--ink); }
  .feed li.new { animation: slide .2s steps(3); }
  .feed li.me { background: var(--yellow); font-weight: 600; }
  @keyframes slide { from { opacity: 0; transform: translateY(-6px); } }
  @media (prefers-reduced-motion: reduce) { .dot, .feed li, .bump { animation: none; } }
  .total b { display: inline-block; }   /* inline boxes cannot be transformed, so the hop needs this */
  .bump { animation: bump .3s steps(3); }
  @keyframes bump { 50% { transform: translateY(-6px); } }
  .drop { position: fixed; z-index: 5; width: 9px; height: 9px; border: 1px solid var(--ink); pointer-events: none; animation: drop .8s steps(10) forwards; }
  @keyframes drop {
    45% { transform: translate(calc(var(--dx) * .6), var(--dy)); }
    100% { transform: translate(var(--dx), 90px); opacity: 0; }
  }
  #toast {
    position: fixed; inset-inline: 0; bottom: 20px; width: fit-content; max-width: calc(100% - 24px); margin: 0 auto;
    padding: 10px 16px; background: var(--ink); color: var(--yellow); border: 2px solid var(--panel);
    box-shadow: 0 0 0 2px var(--ink); font: 600 1.05rem/1.3 var(--pixel); text-align: center;
  }
  footer { text-align: center; font-size: 0.84rem; text-transform: uppercase; letter-spacing: .03em; }
</style>
</head>
<body>
<nav class="menubar">
  <span class="logo px" data-icon="toilet"></span>
  <button id="langBtn" data-t="switchTo"></button>
  <button id="installBtn" data-t="install" hidden></button>
  <button id="sosOpen">🚨 <span data-t="sosShort"></span></button>
  <span class="spacer"></span>
  <span id="date"></span>
</nav>

<main>
  <header>
    <h1><span data-t="h1a"></span> <span class="hl" data-t="h1b"></span></h1>
    <p class="tag" data-t="tag"></p>
    <p class="how" data-t="how"></p>
  </header>

  <section class="win" aria-live="polite">
    <h2><button class="box"></button><span data-t="liveTitle"></span></h2>
    <div class="live">
      <div class="tile g"><b id="inToilet">–</b><small><span class="dot"></span><span data-t="inToilet"></span></small></div>
      <div class="tile y"><b id="holding">–</b><small><span class="dot"></span><span data-t="holding"></span></small></div>
    </div>
    <p class="total"><b id="todayTotal">–</b> <span data-t="total"></span></p>
  </section>

  <label class="namerow">
    <span data-t="nameLabel"></span>
    <input id="name" maxlength="16" autocomplete="nickname" enterkeyhint="done">
  </label>

  <section class="buttons">
    <button id="holdBtn" class="btn"><span class="px" data-icon="hourglass"></span><span data-t="hold" id="holdLabel"></span></button>
    <button id="goBtn" class="btn primary"><span class="px" data-icon="toilet"></span><span data-t="go"></span></button>
  </section>

  <section class="win" id="nudge" role="status" hidden><div class="body" data-t="nudge"></div></section>

  <section class="win" id="timerBox" hidden>
    <h2><button class="box"></button><span data-t="timerTitle"></span></h2>
    <div class="body">
      <div id="timer" dir="ltr"></div>
      <div id="title"></div>
      <div class="muted" id="others"></div>
    </div>
  </section>

  <section class="win newswin">
    <h2><button class="box"></button><span data-t="newsTitle"></span></h2>
    <div class="breaking"><b data-t="breaking"></b><p id="newsTop"></p></div>
    <ul class="news" id="news"></ul>
  </section>

  <section class="win soswin shut" id="sos">
    <h2><button class="box"></button><span data-t="sosTitle"></span></h2>
    <div class="body">
      <button id="sosBtn" class="btn" data-t="sosFind"></button>
      <p id="sosStatus" role="status"></p>
      <ul id="sosList"></ul>
      <details id="sosAdd">
        <summary data-t="sosAddOpen"></summary>
        <p class="muted" data-t="sosAddNote"></p>
        <div class="fee">
          <label><input type="radio" name="fee" value="free"> <span data-t="sosFreeLabel"></span></label>
          <label><input type="radio" name="fee" value="paid"> <span data-t="sosPaidLabel"></span></label>
          <label><input type="radio" name="fee" value="unknown" checked> <span data-t="sosFeeUnknown"></span></label>
        </div>
        <input id="sosNoteIn" maxlength="60" autocomplete="off">
        <button id="sosAddBtn" class="btn small" data-t="sosAddGo"></button>
        <p id="sosAddStatus" role="status"></p>
      </details>
    </div>
  </section>

  <section class="win day">
    <h2><button class="box"></button><span data-t="yourDay"></span></h2>
    <div class="body">
      <div class="stats">
        <div><b id="sCount">0</b><span class="muted" data-t="trips"></span></div>
        <div><b id="sGap">–</b><span class="muted" data-t="gap"></span></div>
        <div><b id="sBest">–</b><span class="muted" data-t="best"></span></div>
      </div>
      <label class="remind"><input type="checkbox" id="remind"> <span data-t="remind"></span></label>
      <button id="shareBtn" class="btn small"><span data-t="share" id="shareLabel"></span></button>
    </div>
  </section>

  <section class="win feedwin">
    <h2><button class="box"></button><span data-t="feedTitle"></span></h2>
    <ul class="feed" id="feed"></ul>
  </section>

  <footer data-t="footer"></footer>
  <div id="toast" role="status" hidden></div>
</main>

<script>
const $ = id => document.getElementById(id);
const MIN = 60_000;
const NUDGE_AFTER = 180 * MIN;
const HOLD_EXPIRY = 180 * MIN; // a forgotten "holding" status clears itself
const TITLE_AT = [0, 5, 15, 30, 45, 60]; // minutes at which each hold title unlocks

// ---- text, per language. Strings are plain text; functions take already-formatted numbers. ----
const T = {
  en: {
    dir: 'ltr', docTitle: 'Holding It — live', switchTo: 'فارسی',
    h1a: 'Holding', h1b: 'It', tag: 'The whole world needs to pee. Live.',
    inToilet: 'in the bathroom right now', holding: 'holding it right now',
    total: 'bathroom trips today, worldwide',
    nudge: '3 hours. Your bladder would like a word. 🚨',
    hold: "I'm holding it", go: 'I went! +1',
    yourDay: 'Your day', trips: 'trips today', gap: 'between trips', best: 'longest hold',
    remind: "Nudge me if I haven't gone in 3 hours",
    share: 'Share my day', copied: 'Copied!', feedTitle: 'Live feed',
    liveTitle: 'Right now', timerTitle: 'Resisting',
    how: 'Need to go, or just went? Tap a button.',
    sosTitle: 'Emergency', sosShort: 'SOS', sosFind: 'Find the nearest toilet',
    sosLocating: 'Getting your location…', sosSearching: 'Searching nearby…',
    sosDenied: 'Location was blocked. Allow it for this site and try again.',

    sosNone: 'Nothing found nearby. Good luck.', sosPartial: 'Some searches did not answer, so the list may be incomplete.', sosWider: 'Nothing very close, so I searched a wider area.', sosMapped: 'Mapped public toilets:', sosNoMapped: 'No public toilet is mapped nearby.',
    sosLikely: 'Places that often have a toilet (not guaranteed):',
    sosToilet: 'Public toilet', sosFee: 'paid', sosFree: 'free', sosGo: 'Take me',
    sosAddOpen: '➕ Is there a public toilet here? Add it',
    sosAddNote: 'It is saved where you are standing and shown to everyone nearby. Public places only, not homes or private spots.',
    sosFreeLabel: 'Free', sosPaidLabel: 'Paid', sosFeeUnknown: 'Not sure',
    sosNotePh: 'Short note, optional (e.g. next to the mosque)', sosAddGo: 'Add this place',
    sosAdding: 'Getting your location…', sosAdded: 'Added. Thank you!',
    sosAddAlready: 'You already added this place.', sosAddLimit: "You've added a lot today. Try again tomorrow.",
    sosAddError: 'Could not add it. Try again in a moment.',
    sosCommunity: 'added by visitors', sosConfirms: n => `confirmed by ${n}`, sosReport: 'Wrong?', sosReported: 'Reported',
    sosKinds: { fuel: 'Petrol station', mosque: 'Mosque / prayer room', worship: 'Place of worship', hospital: 'Hospital', clinic: 'Clinic' },
    metres: n => `${n} m`, kms: n => `${n} km`,
    newsTitle: 'Pee News', breaking: 'Breaking', anon: 'An anonymous hero',
    ranks: ['Rookie', 'Committed', 'Iron Bladder', 'National Hero', 'Living Legend', 'Bomb Squad Case'],
    nRecord: (mins, rank) => `{who} holds today's record with ${mins} minutes of resistance. Title: ${rank}.`,
    nHolding: mins => `Live: {who} has been holding it for ${mins} minutes. The world holds its breath.`,
    nBusy: n => `{who} went ${n} times today. Experts: "At this point it is a lifestyle."`,
    nCountry: (flag, n) => `${flag} is today's busiest country with ${n} trips.`,
    nMilestone: n => `The world passed ${n} bathroom trips today. Markets did not react.`,
    canned: [
      'Experts call tea right before a meeting "a brave but wrong decision".',
      'Study: the bathroom queue is always longest exactly when you are in a hurry.',
      'Bladder spokesperson: "We issued several warnings."',
      'Forecast: 94% chance of a bathroom trip after the second coffee.',
      'Official statement: "I will go in five minutes" remains the biggest lie of the century.',
      'Analysis: the person who left mid-movie missed the best scene.',
      'Special report: the sound of running water named enemy number one of the resistance.',

function renderFeed(feed) {
  const lines = feed.map(e => {
    const mine = myIds.includes(e.id);
    const li = document.createElement('li');
    // A line with a name reads "Ali went" for everyone, its owner included (still marked 🫵);
    // "You went" is only for the owner's own lines that have no name.
    const you = mine && !e.name;
    const text = e.type === 'hold' ? t.fHold(you)
      : e.nth >= 5 ? t.fNth(you, lang === 'en' ? ordinal(e.nth) : num(e.nth))
      : e.held_mins ? t.fAfter(you, num(e.held_mins))
      : t.fGo(you);
    // The flag and the name each sit in their own isolated element. Flag emoji count as
    // left-to-right text, so in the Persian layout a flag next to a Latin name would join it
    // into one left-to-right run and end up after the name instead of before it.
    const flag = document.createElement('bdi');
    flag.textContent = mine ? '🫵' : flagOf(e.country);
    li.append(flag, ' ');
    if (e.name) {
      const [before, ...after] = text.split(t.someone);
      const name = document.createElement('bdi');
      name.textContent = e.name;
      li.append(before, name, after.join(t.someone));
    } else {
      li.append(text);
    }
    if (mine) li.classList.add('me');
    if (e.id > lastFeedId) li.classList.add('new'); // only lines that just arrived slide in
    return li;
  });
  if (!lines.length) {
    const li = document.createElement('li');
    li.textContent = t.feedEmpty;
    lines.push(li);
  }
  $('feed').replaceChildren(...lines);
  lastFeedId = Math.max(lastFeedId, ...feed.map(e => e.id));
}

// ---- Emergency finder: nearby places from OpenStreetMap (Nominatim search, no key) ----
// One category at a time, nearest toilets first, because Nominatim asks for at most one request per
// second. Overpass would be a single query, but its public servers did not answer from phones.
// ponytail: fine for a small crowd; Nominatim's usage policy rules out heavy traffic. If this grows,
// move to a self-hosted or paid map API.
// q is what Nominatim is asked; types keeps only the real thing (the query "mosque" matched bus stops
// that have "Mosque" in their name, while "place of worship" finds the actual buildings).
// The order here is also the order of the list: results arrive one kind at a time and each kind is shown
// as soon as it arrives, so the list only ever grows at the end and nothing jumps around while it loads.
const SEARCHES = [
  { kind: 'toilet', q: 'toilets', types: ['toilets'], radius: 1500, limit: 40 },
  { kind: 'worship', q: 'place of worship', types: ['place_of_worship'], radius: 800, limit: 40 },
  { kind: 'fuel', q: 'petrol station', types: ['fuel'], radius: 800, limit: 40 },
  { kind: 'hospital', q: 'hospital', types: ['hospital'], radius: 1500, limit: 40 },
  { kind: 'clinic', q: 'clinic', types: ['clinic'], radius: 800, limit: 40 },
];

// Distance in metres between two [lat, lon] points (haversine).
function metres([lat1, lon1], [lat2, lon2]) {
  const rad = d => d * Math.PI / 180;
  const a = Math.sin(rad(lat2 - lat1) / 2) ** 2 + Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(rad(lon2 - lon1) / 2) ** 2;
  return 2 * 6_371_000 * Math.asin(Math.sqrt(a));
}
console.assert(Math.abs(metres([52.52, 13.405], [52.53, 13.405]) - 1112) < 3, 'metres');
// The same real place can come back twice (a building and a point mapped for it). Two results of one kind
// are the same place when they are within 15 m, or within 80 m and have the same name.
const sameSpot = (a, b) => a.kind === b.kind && metres(a.pos, b.pos) < (a.name && a.name === b.name ? 80 : 15);
console.assert(sameSpot({ kind: 'worship', name: 'X', pos: [35, 51] }, { kind: 'worship', name: 'X', pos: [35.0004, 51] })
  && !sameSpot({ kind: 'worship', name: 'X', pos: [35, 51] }, { kind: 'fuel', name: 'X', pos: [35, 51] })
  && !sameSpot({ kind: 'worship', name: '', pos: [35, 51] }, { kind: 'worship', name: '', pos: [35.001, 51] }), 'sameSpot');
const fmtDist = m => m < 950 ? t.metres(num(Math.max(10, Math.round(m / 10) * 10))) : t.kms(num((m / 1000).toFixed(1)));

async function search({ q, types, radius, limit }, lat, lon) {
  // Only a box around the position, rounded to about 100 m, leaves the device. Distances use the exact position.
  const [clat, clon] = [lat.toFixed(3), lon.toFixed(3)].map(Number);
  const dLat = radius / 111_320, dLon = dLat / Math.cos(clat * Math.PI / 180);
  const r = await fetch('https://nominatim.openstreetmap.org/search?' + new URLSearchParams({
    format: 'jsonv2', q, bounded: '1', limit, extratags: '1',
    viewbox: [clon - dLon, clat + dLat, clon + dLon, clat - dLat].join(','),   // left, top, right, bottom
  }), { signal: AbortSignal.timeout(10_000) });
  if (!r.ok) throw new Error(`nominatim: ${r.status}`);
  return (await r.json())
    // Churches and temples rarely have a public toilet; mosques do. Places with no religion tag stay.
    .filter(x => types.includes(x.type) && (!x.extratags?.religion || x.extratags.religion === 'muslim'))
    .map(x => ({ name: x.name || '', tags: x.extratags ?? {}, pos: [+x.lat, +x.lon], dist: metres([lat, lon], [+x.lat, +x.lon]) }))
    .sort((a, b) => a.dist - b.dist);
}

function placeRow({ kind, name, tags, pos, dist, community }) {
  const label = kind === 'toilet' ? t.sosToilet : kind === 'worship' ? (tags.religion === 'muslim' ? t.sosKinds.mosque : t.sosKinds.worship) : t.sosKinds[kind];
  const li = document.createElement('li');
  const title = document.createElement('b');
  title.append(bdi(name || label));
  const meta = document.createElement('span');
  meta.className = 'muted';
  meta.textContent = [
    fmtDist(dist),
    name ? label : null,
    community ? t.sosCommunity : null,
    community?.confirms > 1 ? t.sosConfirms(num(community.confirms)) : null,
    tags.fee === 'yes' ? t.sosFee : tags.fee === 'no' ? t.sosFree : null,
    tags.wheelchair === 'yes' ? '♿' : null,
  ].filter(Boolean).join(' · ');
  const go = document.createElement('a');   // hands the route to the phone's own maps app
  go.className = 'btn small';
  go.href = `https://www.google.com/maps/dir/?api=1&destination=${pos[0]},${pos[1]}&travelmode=walking`;
  go.target = '_blank';
  go.rel = 'noopener';
  go.textContent = t.sosGo;
  li.append(title, go, meta);
  if (community) {   // anyone can flag a wrong place; three different browsers hide it
    const report = document.createElement('button');
    report.className = 'report';
    report.textContent = t.sosReport;
    report.onclick = () => {
      rpc('report_place', { p_session: session, p_id: community.id }).catch(() => {});
      report.textContent = t.sosReported;
      report.disabled = true;
    };
    li.append(report);
  }
  return li;
}

function setStatus(text, warn = false) {
  $('sosStatus').textContent = text;
  $('sosStatus').classList.toggle('warn', warn && !!text);
}

// found: places so far (each with its kind); done: every search has finished; failed: kinds whose search errored;
// widened: nothing was close by, so a bigger area was searched; where: the searched position, rounded, for the "nothing" message.
function showPlaces(found, done, failed, widened, where) {
  const heading = text => { const li = document.createElement('li'); li.className = 'group'; li.textContent = text; return li; };
  const toilets = found.filter(p => p.kind === 'toilet').sort((a, b) => a.dist - b.dist).slice(0, 5);
  // The two nearest of each kind, kinds in search order, so the many clinics do not crowd out the rest.
  const likely = SEARCHES.map(s => s.kind).filter(k => k !== 'toilet')
    .flatMap(k => found.filter(p => p.kind === k).sort((a, b) => a.dist - b.dist).slice(0, 2));
  // Notices that need your attention (nothing mapped, an error, no permission) get a yellow box; progress stays quiet.
  let [message, warn] = !done ? [t.sosSearching, false]
    : failed.includes('toilet') && !toilets.length ? [t.sosError, true]
    : !found.length ? [`${t.sosNone} (${where})`, true]
    : !toilets.length ? [t.sosNoMapped, true]
    : failed.length ? [t.sosPartial, true]   // some kinds did not answer, so something may be missing
    : widened && !toilets.some(p => p.dist <= SEARCHES[0].radius) ? [t.sosWider, false]   // only when no toilet is close
    : ['', false];
  if (done && failed.length && message && message !== t.sosPartial && message !== t.sosError) message += ' ' + t.sosPartial;   // say so when part of the search failed
  setStatus(message, warn);
  $('sosList').replaceChildren(
    ...(toilets.length ? [heading(t.sosMapped), ...toilets.map(placeRow)] : []),
    ...(likely.length ? [heading(t.sosLikely), ...likely.map(placeRow)] : []));
}

$('sosBtn').onclick = () => {
  $('sosList').replaceChildren();
  if (!navigator.geolocation) { setStatus(t.sosNoGeo, true); return; }
  setStatus(t.sosLocating);
  navigator.geolocation.getCurrentPosition(async ({ coords: { latitude, longitude } }) => {
    setStatus(t.sosSearching);
    const where = `${latitude.toFixed(2)}, ${longitude.toFixed(2)}`;
    const found = [], failed = new Set(), have = new Set();
    let widened = false, requests = 0;
    // Places visitors added come from our own database, so they show up right away.
    try {
      const mine = await rpc('places_near', { p_lat: latitude, p_lon: longitude, p_radius: 5000 });
      found.push(...mine.map(r => ({
        kind: 'toilet', name: r.note || '', pos: [r.lat, r.lon], dist: metres([latitude, longitude], [r.lat, r.lon]),
        tags: { fee: r.fee === 'free' ? 'no' : r.fee === 'paid' ? 'yes' : undefined },
        community: { id: r.id, confirms: r.confirms },
      })));
      if (found.length) showPlaces(found, false, [], false, where);
    } catch {}   // our database being unreachable must not stop the map search
    for (const scale of [1, 3]) {   // second round: a 3x bigger area, only for categories that found nothing
      const todo = SEARCHES.filter(s => !have.has(s.kind));
      widened ||= scale > 1 && todo.length > 0;
      for (const s of todo) {
        if (requests++) await new Promise(r => setTimeout(r, 1100));   // at most one Nominatim request per second
        try {
          const places = await search({ ...s, radius: s.radius * scale }, latitude, longitude);
          failed.delete(s.kind);
          if (places.length) have.add(s.kind);
          for (const p of places.map(q => ({ ...q, kind: s.kind }))) if (!found.some(f => sameSpot(f, p))) found.push(p);
        } catch { failed.add(s.kind); }
        showPlaces(found, false, [...failed], widened, where);   // show each category as soon as it arrives
      }
    }
    showPlaces(found, true, [...failed], widened, where);
  }, () => { setStatus(t.sosDenied, true); },
  { enableHighAccuracy: true, timeout: 10_000, maximumAge: 60_000 });
};
$('sosNoteIn').placeholder = t.sosNotePh;
$('sosAddBtn').onclick = () => {
  const status = $('sosAddStatus');
  if (!navigator.geolocation) { status.textContent = t.sosNoGeo; return; }
  status.textContent = t.sosAdding;
  $('sosAddBtn').disabled = true;
  navigator.geolocation.getCurrentPosition(async ({ coords }) => {
    try {
      await rpc('add_place', {
        p_session: session, p_lat: coords.latitude, p_lon: coords.longitude,
        p_fee: document.querySelector('input[name=fee]:checked').value, p_note: $('sosNoteIn').value.trim() || null,
      });
      status.textContent = t.sosAdded;
      $('sosNoteIn').value = '';
    } catch (e) {
      status.textContent = /already/.test(e.message) ? t.sosAddAlready : /limit/.test(e.message) ? t.sosAddLimit : t.sosAddError;
    }
    $('sosAddBtn').disabled = false;
  }, () => { status.textContent = t.sosDenied; $('sosAddBtn').disabled = false; },
  { enableHighAccuracy: true, timeout: 10_000 });
};

// The menu-bar button opens the (normally collapsed) window and starts the search in one tap.
$('sosOpen').onclick = () => {
  $('sos').classList.remove('shut');
  $('sos').scrollIntoView({ behavior: 'smooth', block: 'center' });
  $('sosBtn').click();
};

// ponytail: polls every 5 seconds. Fine for a small crowd; move to Supabase Realtime if it gets busy.
async function pulse() {
  try {
    const p = await rpc('pulse');
    world = { inToilet: p.in_toilet, holding: p.holding, todayTotal: p.today };
    renderFeed(p.feed);
    render();
  } catch {} // offline: keep showing the last known numbers
}

async function publish(type, heldMins = 0) {
  try {
    const id = await rpc('log_event', { p_session: session, p_type: type, p_held_mins: heldMins, p_name: me.name || null });
    myIds = [...myIds, id].slice(-30);
    try { localStorage.setItem('holdingit-ids', JSON.stringify(myIds)); } catch {}
  } catch {} // offline or rate limited: the personal stats above still count on this device
  pulse();
}

let toastTimer;
function toast(text) {
  $('toast').textContent = text;
  $('toast').hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').hidden = true, 2200);
}

// Set a number and make it hop when it actually changed.
function setNum(id, text) {
  const el = $(id);
  if (el.textContent === text) return;
  el.textContent = text;
  el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); // restart the animation
}

// A burst of pixel droplets from a button.
function splash(btn) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const r = btn.getBoundingClientRect();
  for (let i = 0; i < 14; i++) {
    const d = document.createElement('i');
    d.className = 'drop';
    d.style.cssText = `left:${r.left + r.width / 2}px;top:${r.top + r.height / 2}px;`
      + `--dx:${Math.random() * 260 - 130}px;--dy:${-50 - Math.random() * 110}px;`
      + `background:${['#3fd0bd', '#5cc8ff', '#ffd23f'][i % 3]}`;
    d.onanimationend = () => d.remove();
    document.body.append(d);
  }
}

function render() {
  // New day: reset the daily stats. Checked on every render, so an app left open overnight resets too.
  const day = new Date().toDateString();
  if (me.day !== day) { me = { ...me, day, trips: [], bestHold: 0 }; save(); }
  const holding = me.holdingSince !== null;
  const live = n => n === null ? '–' : num(n.toLocaleString('en'));
  setNum('inToilet', live(world.inToilet));
  setNum('holding', live(world.holding));
  setNum('todayTotal', live(world.todayTotal));
  $('others').textContent = t.others(num(Math.max(0, (world.holding ?? 1) - 1)));
  $('timerBox').hidden = !holding;
  $('holdBtn').disabled = holding;
  $('holdLabel').textContent = holding ? t.holdingNow : t.hold;
  if (holding) {
    const ms = Date.now() - me.holdingSince;
    if (ms > HOLD_EXPIRY) { me.holdingSince = null; save(); return render(); }
    const s = Math.floor(ms / 1000);
    // Latin digits in both languages: the Persian zero is a tiny dot, so ۰۰:۰۰ is hard to read as a clock
    $('timer').textContent = [Math.floor(s / 60), s % 60].map(n => String(n).padStart(2, '0')).join(':');
    $('title').textContent = t.titles[titleIndex(ms)];
  }
  // Nudge once per dry spell, counted from the last trip (or from switching the nudge on).
  // ponytail: only fires while this tab is open, and has no quiet hours. Closed-tab
  // reminders need Web Push + a server; add when people actually come back.
  const since = Math.max(me.trips.at(-1) ?? 0, me.remindOn ?? 0);
  const overdue = !!me.remind && Date.now() - since > NUDGE_AFTER;
  $('nudge').hidden = !overdue;
  if (overdue && me.nudgedFor !== since) {
    me.nudgedFor = since; save();
    if (document.hidden && window.Notification?.permission === 'granted')
      // Android only allows notifications through the service worker; plain Notification is the fallback.
      (navigator.serviceWorker
        ? navigator.serviceWorker.ready.then(reg => reg.showNotification(`${t.h1a} ${t.h1b}`, { body: t.nudge, icon: 'icon-192.png' }))
        : Promise.resolve(new Notification(`${t.h1a} ${t.h1b}`, { body: t.nudge }))).catch(() => {});
  }
  const gap = avgGap(me.trips);
  setNum('sCount', num(me.trips.length));
  const dur = ms => ms >= MIN ? fmtMin(ms) : '–'; // under a minute is noise, not a stat
  $('sGap').textContent = gap === null ? '–' : dur(gap);
  $('sBest').textContent = dur(me.bestHold);
}

$('holdBtn').onclick = () => {
  me.holdingSince = Date.now();
  save(); publish('hold'); render(); toast(t.toastHold);
};
$('goBtn').onclick = () => {
  const held = me.holdingSince ? Date.now() - me.holdingSince : 0;
  me.bestHold = Math.max(me.bestHold, held);
  me.holdingSince = null;
  me.trips.push(Date.now());
  save(); publish('go', Math.floor(held / MIN)); render(); toast(t.toastGo(num(me.trips.length))); splash($('goBtn'));
};

// Optional nickname, kept on this device and sent with each button press.
$('name').placeholder = t.namePh;
$('name').value = me.name ?? '';
$('name').oninput = e => { me.name = e.target.value.trim().slice(0, 16); save(); };

$('remind').checked = !!me.remind;
$('remind').onchange = e => {
  me.remind = e.target.checked;
  me.remindOn = Date.now();
  save(); render();
  // Ask for permission only after the user opts in, never on page load.
  if (me.remind && window.Notification?.permission === 'default') Notification.requestPermission();
};

const shareText = () => t.shareText(num(me.trips.length), me.bestHold >= MIN ? fmtMin(me.bestHold) : '');
$('shareBtn').onclick = async () => {
  const data = { text: shareText(), url: location.href };
  try {
    if (navigator.share) return await navigator.share(data);
    await navigator.clipboard.writeText(`${data.text} ${data.url}`);
    $('shareLabel').textContent = t.copied;
    setTimeout(() => $('shareLabel').textContent = t.share, 1500);
  } catch {} // user closed the share sheet, or clipboard is blocked
};

// ---- installable app ----
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
// Chrome/Android fire this when the page can be installed; iOS has no such event (Share > Add to Home Screen).
let installEvent;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvent = e; $('installBtn').hidden = false; });
$('installBtn').onclick = async () => {
  installEvent.prompt();
  await installEvent.userChoice;
  $('installBtn').hidden = true;
};

render();
setInterval(render, 1000);
pulse();
setInterval(() => { if (!document.hidden) pulse(); }, 5000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) pulse(); });
loadNews();
setInterval(() => { if (!document.hidden) loadNews(); }, 60_000);
</script>
</body>
</html>
